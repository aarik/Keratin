name: keratin
version: 0.1.4
authors:
  - Aarik W
description: >
  MCP bridge connecting Claude AI to Rhinoceros 3D.
  Adds StartKeratin and StopKeratin commands to Rhino.

  After installing, also install the companion MCP server:
    pip install keratin

  Then type StartKeratin in Rhino's command line to begin.

  For MCP client configuration and full documentation, see:
    https://github.com/aarik/keratin
url: https://github.com/aarik/keratin
icon: icon.png
keywords:
  - mcp
  - ai
  - claude
  - rhino
  - rhinoscript
  - grasshopper
  - automation
  - jewelry
